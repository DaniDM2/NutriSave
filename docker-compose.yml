services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php-fpm -R
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutrisave

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nutrisave

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    networks:
      - nutrisave

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nutrisave

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nutrisave}
      POSTGRES_USER: ${DB_USERNAME:-nutrisave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nutrisave} -d ${DB_DATABASE:-nutrisave}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nutrisave

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nutrisave

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    networks:
      - nutrisave

volumes:
  pgsql_data:
  redis_data:
  vite_node_modules:

networks:
  nutrisave:
    driver: bridge
